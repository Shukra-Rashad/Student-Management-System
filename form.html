<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Form - Student Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
rel="stylesheet">
</head>

<body class style="background-color: #CBEAF2;">

    <!-- Navigation -->

 <nav class="navbar navbar-expand-lg navbar-dark"style="background-color: #1E3A5F;">
   <div class="container-fluid">
     <a class="navbar-brand" href="#">Student Management System</a>
     <div>
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="form.html">Form</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
        <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
      </ul>
     </div>
   </div>
 </nav>

 <div class="container mt-5">
  <h2 class="mb-4">Student Registration</h2>
  <form onsubmit="return validateForm()">

   <div class="mb-3">
    <label class="form-label">Name</label>
    <input type="text" id="name" class="form-control" placeholder="Enter Student Name">
   </div>

   <div class="mb-3">
    <label class="form-label">Email</label>
    <input type="email" id="email" class="form-control" placeholder="Enter Email">
   </div>

   <div class="mb-3">
    <label class="form-label">Phone</label>
    <input type="text" id="phone" class="form-control" placeholder="Enter Phone Number">
   </div>

   <button type="submit" class="btn text-white"
        style="background-color: #1E3A5F;">
    Submit
</button>
   <button type="reset" class="btn btn-secondary">Clear Form</button>
  </form>
 </div>

<script>
function validateForm() {
 let name = document.getElementById("name").value;
 let email = document.getElementById("email").value;
 let phone = document.getElementById("phone").value;
 if (name=="" || email=="" || phone=="") { alert("All fields required!"); return false; }
 if (!email.includes("@")) { alert("Invalid email!"); return false; }
 if (phone.length !== 10 || isNaN(phone)) { alert("Phone must be 10 digits!"); return false; }
 return true;
}
</script>
</body>
</html>
