<!-- Registration Form -->
<main class="container flex-grow-1 py-4">

    <div class="text-center mb-5">
        <h1 class="page-title">Student Registration</h1>
        <p class="text-secondary">
            Please enter your details in the form below.
        </p>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">

            <div class="form-card">

              <form id="studentForm" action="register_student.php" method="POST">

                    <div class="mb-4">
                        <label for="name" class="form-label">
                            <i class="bi bi-person me-2"></i>Full Name
                        </label>
                        <input type="text" class="form-control" id="name"
                               name="full_name" placeholder="Enter your full name"
                               required>
                    </div>

                    <div class="mb-4">
                        <label for="email" class="form-label">
                            <i class="bi bi-envelope me-2"></i>Email Address
                        </label>
                        <input type="email" class="form-control" id="email"
                               name="email" placeholder="example@email.com"
                               required>
                    </div>

                    <div class="mb-4">
                        <label for="phone" class="form-label">
                            <i class="bi bi-telephone me-2"></i>Phone Number
                        </label>
                        <input type="tel" class="form-control" id="phone"
                               name="phone" placeholder="Enter 10-digit phone number"
                               pattern="[0-9]{10}" maxlength="10"
                               inputmode="numeric" required>
                        
                    </div>

                    <div id="message" class="mb-3" role="alert"></div>

                    <div class="d-flex gap-1">
                        <button type="submit" class="btn btn-custom">
                            Register Student
                            <i class="bi bi-arrow-right ms-2"></i>
                        </button>


                          <button type="reset" class="btn btn-secondary">
                              Clear
                          </button>
                      </div>
                    </div>

                </form>

            </div>

        </div>
    </div>

</main>

<!-- Footer -->
<footer class="text-center py-3 mt-4">
    <small>Student Management System 2026 | Developed by Shukra Rashad</small>
</footer>



<script>
    document.getElementById("studentForm").addEventListener("submit", function(event) {
        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        const phone = document.getElementById("phone").value.trim();
        const message = document.getElementById("message");

        if (name === "" || email === "" || phone === "") {
            event.preventDefault();
            message.className = "alert alert-danger mb-3";
            message.textContent = "Please fill in all the fields.";
            return;
        }

        if (!/^[0-9]{10}$/.test(phone)) {
            event.preventDefault();
            message.className = "alert alert-danger mb-3";
            message.textContent = "Please enter a valid 10-digit phone number.";
            return;
        }
    });
</script>
