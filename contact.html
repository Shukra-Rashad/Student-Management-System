<div class="container mt-5">

    <h2 class="mb-4">Contact Us</h2>

    <form>

        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" class="form-control" placeholder="Enter Your Name">
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" placeholder="Enter Your Email">
        </div>

        <div class="mb-3">
            <label class="form-label">Message</label>
            <textarea class="form-control" rows="4" placeholder="Enter Your Message"></textarea>
        </div>

        <button type="button" class="btn btn-primary" style="background-color: #1E3A5F;"
            onclick="alert('Contact form demonstration only. No message has been sent.')">
            Send Message
        </button>

    </form>
