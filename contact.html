<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Contact Us - Student Management System</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet">

     <!-- Bootstrap Icons -->
     <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
     rel="stylesheet">

    <style>
        body {
            background-color: #F5F7FA;
            color: #374151;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background-color: #1E3A5F;
        }

        .navbar-brand {
            font-weight: bold;
        }

        .nav-link {
            color: white;
            margin-left: 10px;
        }

        .nav-link:hover,
        .nav-link.active {
            color: #93C5FD;
        }

        .page-title {
            color: #1E3A5F;
            font-weight: bold;
        }

        .contact-card {
            background-color: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
        }

        .form-label {
            font-weight: 600;
        }

        .form-control {
            padding: 10px;
        }

        .btn-custom {
            background-color: #1E3A5F;
            color: white;
            padding: 10px 22px;
        }

        .btn-custom:hover {
            background-color: #3B82F6;
            color: white;
        }

        footer {
            background-color: #1E3A5F;
            color: white;
        }
    </style>
</head>

<body class="d-flex flex-column min-vh-100">

   <!-- Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">

        <a class="navbar-brand" href="index.html">
            <i class="bi bi-mortarboard-fill me-2"></i>
            Student Management System
        </a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#navbarMenu"
                aria-controls="navbarMenu" aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarMenu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="index.html">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="form.html">Registration</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="about.html">About</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="contact.html">Contact</a>
                </li>
            </ul>
        </div>

    </div>
</nav>

    <!-- Contact Section -->
    <main class="container flex-grow-1 py-3">

        <div class="text-center mb-4">
            <h1 class="page-title">Contact Us</h1>

            <p class="text-muted">
                Have a question or suggestion? Send us a message.
            </p>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">

                <div class="contact-card">

                    <form onsubmit="return validateContactForm()">

                        <div class="mb-3">
                            <label for="contactName" class="form-label">
                                Your Name
                            </label>

                            <input type="text" id="contactName"
                            class="form-control"
                            placeholder="Enter your name">
                        </div>

                        <div class="mb-3">
                            <label for="contactEmail" class="form-label">
                                Email Address
                            </label>

                            <input type="email" id="contactEmail"
                            class="form-control"
                            placeholder="Enter your email">
                        </div>

                        <div class="mb-3">
                            <label for="contactMessage" class="form-label">
                                Message
                            </label>

                            <textarea id="contactMessage"
                            class="form-control" rows="2"
                            placeholder="Write your message"></textarea>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-custom">
                                Send Message
                            </button>
                        </div>

                    </form>

                </div>

            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center py-3 mt-auto">
        <small>Student Management System 2026 | Developed by Shukra Rashad</small>
    </footer>

    <!-- JavaScript Validation -->
    <script>
        function validateContactForm() {

            let name = document.getElementById("contactName").value.trim();
            let email = document.getElementById("contactEmail").value.trim();
            let message = document.getElementById("contactMessage").value.trim();

            if (name === "" || email === "" || message === "") {
                alert("Please fill in all fields!");
                return false;
            }

            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                alert("Please enter a valid email address!");
                return false;
            }

            alert("Your message has passed validation!");
            return false;
        }
    </script>

</body>
</html>
